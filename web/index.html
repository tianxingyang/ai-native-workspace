<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CoSeat 同席</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<!-- THESIS: A shared conversation with human and agent peers; work stays beside its source.
OWN-WORLD: Ink text, pale slate navigation, white reading surface, deep teal actions; aligned initials and restrained rules.
STORY: Enter an authorized room, discuss, inspect research and request a confirmed stop.
FIRST VIEWPORT: 280px conversation rail, room header and member line, spacious chronological messages, bottom composer. Narrow screens switch between rooms and chat.
FORM: Brief-pinned familiar team messenger, code-led reusable interface. Signature interaction: source-linked research unfolds in the message stream.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<section id="connect" class="connection-page" aria-labelledby="connect-title">
  <div class="connect-panel"><div class="wordmark">CoSeat <span>同席</span></div>
    <h1 id="connect-title">回到团队的讨论中</h1>
    <p>人与 Agent，同席协作。连接后查看你获准访问的会话。</p>
    <form id="connect-form"><label for="token">本地演示访问凭据</label><input id="token" type="password" autocomplete="off" spellcheck="false" required maxlength="512" aria-describedby="credential-help"><button class="primary" id="connect-button">连接会话</button></form>
    <p id="credential-help" class="muted">使用启动演示时生成的临时凭据。仅在当前页面内存中保留；刷新或退出后需重新连接。</p>
    <p id="connect-error" class="error" role="alert"></p>
    <div class="demo-note">本地模拟演示 · Agent 使用合成资料，不进行真实调研。</div>
  </div>
</section>
<div id="app" class="shell" hidden>
  <aside id="sidebar" class="sidebar" aria-label="会话导航">
    <div class="brand-row"><div class="wordmark">CoSeat <span>同席</span></div><span class="tag">本地演示</span></div>
    <div class="section-title"><h1>会话</h1><span id="room-count"></span></div>
    <nav id="rooms" aria-label="已授权会话"></nav>
    <div class="sidebar-footer"><div id="identity"></div><button id="logout" class="quiet">退出连接</button></div>
  </aside>
  <main id="chat" class="chat">
    <header class="chat-header"><button id="back" class="quiet back">会话列表</button><div class="heading"><h2 id="room-title"></h2><p id="thread-title"></p></div><button id="members-toggle" class="quiet" aria-expanded="false" aria-controls="members">成员</button></header>
    <div id="members" class="members" hidden></div>
    <div class="context-strip"><span>模拟 Agent · 仅使用合成资料</span><span id="connection-status" role="status">正在连接</span></div>
    <div id="sync-error" class="sync-error" hidden><span id="sync-error-text"></span><button id="reconnect" class="quiet">立即重连</button></div>
    <div id="source-filter" class="source-filter" hidden><span>正在查看这条消息的讨论与研究</span><button id="all-messages" class="quiet">返回全部消息</button></div>
    <section id="timeline" class="timeline" aria-label="消息记录" tabindex="0"><div id="messages"></div></section>
    <button id="new-messages" class="new-messages" hidden>查看新消息</button>
    <div class="composer-wrap"><div id="outbox" aria-live="polite"></div>
      <form id="composer"><label class="sr-only" for="message">发送到当前会话的消息</label><textarea id="message" rows="3" maxlength="8000" placeholder="和团队说点什么…"></textarea><div class="composer-bottom"><span id="send-help">Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary" type="submit">发送</button></div></form>
      <p id="scope-note" class="scope-note"></p>
    </div>
  </main>
</div>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
