[package]
name = "coseat-desktop"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = "2"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT"] }
uuid = { version = "=1.29.0", features = ["v4"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
